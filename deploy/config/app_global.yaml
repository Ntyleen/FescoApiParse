# config/defaults.yaml
# ===================
# Базовая конфигурация FESCO Container Tracking

# API настройки FESCO
api:
  base_url: "https://api.fesco.com/api/v1/lk/"
  token_type: "Bearer"
  auth_token: "${FESCO_TOKEN}"
  
  # HTTP настройки
  timeout_seconds: 15
  max_parallel: 10
  max_retries: 3
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"

# Настройки кэширования
cache:
  type: "redis"  # "file" или "redis"
  ttl_hours: 1
  
  # Файловый кэш
  dir: "./app_cache/"
  
  # Redis настройки (используются только если type: "redis")
  redis:
    url: "redis://localhost:6379"
    cache_prefix: "cache_fesco:"
    binding_prefix: "binding_fesco:"
    max_connections: 20
    socket_connect_timeout: 5
    socket_timeout: 5
    retry_on_timeout: true
    decode_responses: true

# Настройки логирования
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(message)s"
  date_format: "%H:%M:%S"
  file: null  # null = только консоль, или путь к файлу
  
  # Уровни логирования для внешних библиотек
  external_levels:
    aiohttp: "WARNING"
    asyncio: "WARNING"
    urllib3: "WARNING"
    redis: "WARNING"

# Настройки вывода результатов
output:
  dir: "./app_output/"
  filename: "fesco_tracking_results.json"
  sort_by_container: true
  include_metadata: true

# Настройки обработки
processing:
  batch_size: 50
  pause_between_batches: 0.5
  deduplicate_events: true
  prefer_container_events: true
  enable_retries: true

BrokerDatabase:
    # === НАСТРОЙКИ ENTITY ТАБЛИЦЫ ===
  table_name: "ENTITY"
  primary_key: "ID"
  container_column: "NAME"
  status_column: "SP_ENTITY_STATUS"
  line_column: "LEGAL_PERSON_LINE_ID"
  railway_carrier_column: "LEGAL_PERSON_RAILWAY_CARRIER_ID"

  # === КОЛОНКИ ДАТ ===
  date_eta: "DATE_ETA"
  date_etd: "DATE_ETD"
  date_in: "DATE_IN"
  date_railway_loading: "DATE_RAILWAY_LOADING"
  date_railway_delivery: "DATE_RAILWAY_DELIVERY"
  remaining_distance: "TRACING_DAYS"
  
  # === НАСТРОЙКИ ОБРАБОТКИ ===
  excluded_status_ids: [8, 9, 24]
  target_line_ids: 451
  target_railway_carrier_ids: [451, 759]  
  batch_size: 100
  max_connections: 10
---






